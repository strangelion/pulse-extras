name: Extension test package

on:
  workflow_dispatch:
    inputs:
      request:
        description: 'Test package selection, e.g. share=0.1.0-rc.1 or all=0.0.0-upstream'
        type: string
        required: false
        default: all=0.0.0-upstream
      run_regression:
        description: 'Run full regression before packaging (always enabled for SDK validation)'
        type: boolean
        required: false
        default: false
  pull_request:
    branches: [main]
    paths:
      - 'sdk/upstream.toml'
      - 'shared/pulse/raw/pulse_all.zig'
      - 'scripts/upstream_*.py'
      - '.github/workflows/upstream-candidate.yml'

permissions:
  contents: read

concurrency:
  group: upstream-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_regression }}
    uses: ./.github/workflows/zig.yml
    permissions:
      contents: read

  package:
    needs: regression
    # Manual packaging may explicitly omit regression; failures/cancellations
    # in a requested regression must never be treated as a pass.
    if: ${{ !cancelled() && (needs.regression.result == 'success' || (github.event_name == 'workflow_dispatch' && !inputs.run_regression && needs.regression.result == 'skipped')) }}
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      CANDIDATE_REQUEST: ${{ inputs.request || 'all=0.0.0-upstream' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned Zig
        run: python scripts/install_zig.py
      - name: Read candidate upstream pin
        id: upstream
        run: python scripts/upstream_pin.py
      - name: Checkout pinned author tools
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.upstream.outputs.repository }}
          ref: ${{ steps.upstream.outputs.revision }}
          path: .local/sdk
          persist-credentials: false
      - name: Validate candidate product selection
        id: selection
        shell: pwsh
        run: |
          python -c 'import os,sys; sys.path.insert(0,"scripts"); import release_workflow as r; items=r.plan(os.environ["CANDIDATE_REQUEST"],"dry-run"); print("share="+str(any(x["product"]=="share" for x in items)).lower(),file=open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8"))'
      - name: Set up pinned Go for selected Share package
        if: steps.selection.outputs.share == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
          cache: false
      - name: Prepare pinned Rust for selected Share package
        if: steps.selection.outputs.share == 'true'
        working-directory: shared/share/pake
        run: |
          rustup show active-toolchain
          rustc --version
          rustup target add x86_64-pc-windows-msvc
      - name: Package selected extensions (never publish)
        shell: pwsh
        run: python scripts/release_workflow.py candidate --request "$env:CANDIDATE_REQUEST" --out .local/upstream-candidates
      - name: Record verification scope
        shell: pwsh
        env:
          REGRESSION_RESULT: ${{ needs.regression.result }}
        run: |
          "## Unsigned test packages" >> $env:GITHUB_STEP_SUMMARY
          "Source: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY
          "Regression in this run: $env:REGRESSION_RESULT" >> $env:GITHUB_STEP_SUMMARY
          "Official package verification is required. Real-host acceptance, signing and publication are not performed." >> $env:GITHUB_STEP_SUMMARY
      - name: Preserve candidate packages
        uses: actions/upload-artifact@v4
        with:
          name: upstream-candidate-packages
          path: .local/upstream-candidates/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-package-logs
          path: .local/release-work/**/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
