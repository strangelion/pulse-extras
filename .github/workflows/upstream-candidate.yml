name: Upstream candidate compatibility

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'sdk/upstream.toml'
      - 'shared/pulse/raw/pulse_all.zig'
      - 'scripts/upstream_*.py'
      - '.github/workflows/upstream-candidate.yml'

permissions:
  contents: read

concurrency:
  group: upstream-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    uses: ./.github/workflows/zig.yml
    permissions:
      contents: read

  package:
    needs: regression
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned Zig
        run: python scripts/install_zig.py
      - name: Read candidate upstream pin
        id: upstream
        run: python scripts/upstream_pin.py
      - name: Checkout pinned author tools
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.upstream.outputs.repository }}
          ref: ${{ steps.upstream.outputs.revision }}
          path: .local/sdk
          persist-credentials: false
      - name: Package every registered extension (never publish)
        run: python scripts/release_workflow.py candidate --out .local/upstream-candidates
      - name: Preserve candidate packages
        uses: actions/upload-artifact@v4
        with:
          name: upstream-candidate-packages
          path: .local/upstream-candidates/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-package-logs
          path: .local/release-work/**/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
