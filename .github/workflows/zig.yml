name: Zig regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    name: Detect change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      level: ${{ steps.scope.outputs.level }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test change classifier
        run: python3 -m unittest discover -s scripts -p 'test_ci_scope.py'
      - name: Determine CI scope
        id: scope
        run: python3 scripts/ci_scope.py

  checks:
    needs: scope
    if: needs.scope.outputs.level != 'docs'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check Python scripts compile
        run: python -m compileall -q scripts
      - name: Test CI helper scripts
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Restore Zig archive cache
        id: zig-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/pulse-zig-archives
          key: zig-archive-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.zig-version', 'scripts/zig-downloads.json') }}
      - name: Install and verify pinned Zig
        run: python scripts/install_zig.py
      - name: Save verified Zig archive immediately
        if: steps.zig-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/pulse-zig-archives
          key: ${{ steps.zig-cache.outputs.cache-primary-key }}
      - run: zig version
      - name: Check Zig formatting (show exact correction on failure)
        shell: bash
        run: |
          if ! zig fmt --check build.zig shared extensions; then
            zig fmt build.zig shared extensions || exit 1
            git --no-pager diff -- build.zig shared extensions
            echo "::error::Zig formatting differs; apply zig fmt locally before committing."
            exit 1
          fi
      - name: Isolated Windows Job Object tests (phase diagnostics)
        if: runner.os == 'Windows'
        timeout-minutes: 4
        shell: pwsh
        run: |
          foreach ($filter in @('Windows job ABI', 'Windows job captures', 'Windows job times out', 'Windows job rejects')) {
            Write-Host "::group::$filter"
            zig test shared/process/windows_tree.zig --test-filter "$filter"
            $status = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($status -ne 0) { exit $status }
          }
      - name: Shared Windows native primitives and isolated crash fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 6
        run: |
          New-Item -ItemType Directory -Path zig-out/shared-fixture -Force | Out-Null
          zig cc -std=c11 -Wall -Wextra -Werror -target x86_64-windows-gnu shared/fs/private_root_win32.c tests/shared/private_root_win32_test.c -ladvapi32 -o zig-out/shared-fixture/private-root-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./zig-out/shared-fixture/private-root-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig cc -std=c11 -Wall -Wextra -Werror -target x86_64-windows-gnu shared/process/image_win32.c shared/process/job_win32.c shared/process/metrics_win32.c shared/network/https_win32.c tests/shared/native_primitives_win32_test.c -lwinhttp -luser32 -lpsapi -o zig-out/shared-fixture/native-primitives-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./zig-out/shared-fixture/native-primitives-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig cc -std=c11 -Wall -Wextra -Werror -target x86_64-windows-gnu -c shared/diagnostics/store_win32.c -o zig-out/shared-fixture/diagnostic-store.o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig cc -std=c11 -Wall -Wextra -Werror -target x86_64-windows-gnu tests/shared/crash_fixture_win32.c -o zig-out/shared-fixture/pulse-shared-crash-fixture.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig cc -std=c11 -Wall -Wextra -Werror -target x86_64-windows-gnu shared/diagnostics/crash_win32.c tests/shared/crash_collector_win32.c -lshell32 -ladvapi32 -o zig-out/shared-fixture/pulse-shared-crash-capture.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/shared/test_crash_capture.py zig-out/shared-fixture/pulse-shared-crash-capture.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned Jujutsu CLI
        run: python scripts/ci_vcs.py jj
      - name: Check Git and JJ tools
        run: |
          git --version
          jj --version
      - name: Install Subversion and prepare local fixture
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends subversion
          svn --version --quiet
          python scripts/ci_vcs.py svn-fixture
      - name: Unit and real repository integration tests
        timeout-minutes: 15
        run: zig build test --summary all
        env:
          PULSE_REQUIRE_GIT: '1'
          PULSE_REQUIRE_JJ: '1'
      - run: zig build -Dtarget=x86_64-windows-msvc -Doptimize=ReleaseSafe --summary all
      - name: Fetch pinned native SDK headers
        if: runner.os == 'Windows' && needs.scope.outputs.level != 'vcs'
        run: python scripts/fetch_sdk.py
      - name: Verify generated bindings match the pinned SDK
        if: runner.os == 'Windows' && needs.scope.outputs.level != 'vcs'
        run: python scripts/generate_bindings.py --check
      - name: Verify actual DLL against C ABI
        if: runner.os == 'Windows' && needs.scope.outputs.level != 'vcs'
        shell: pwsh
        run: |
          zig cc -std=c11 -target x86_64-windows-gnu -I.sdk-cache/include tests/abi/loader.c -o zig-out/abi-loader.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dll = @(Get-ChildItem zig-out -Recurse -Filter pulse_abi_probe.dll)
          if ($dll.Count -ne 1) { throw "Expected one ABI probe DLL" }
          & ./zig-out/abi-loader.exe $dll[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  gate:
    name: Regression gate
    if: always()
    needs: [scope, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm required checks completed
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          LEVEL: ${{ needs.scope.outputs.level }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        shell: bash
        run: |
          if [[ "$SCOPE_RESULT" != success ]]; then
            echo "::error::Change classification did not succeed"
            exit 1
          fi
          case "$LEVEL:$CHECKS_RESULT" in
            docs:skipped)
              echo "Documentation-only change; code checks not run."
              ;;
            vcs:success|full:success)
              echo "Required $LEVEL regression checks passed."
              ;;
            *)
              echo "::error::Unexpected scope/check status: $LEVEL:$CHECKS_RESULT"
              exit 1
              ;;
          esac
