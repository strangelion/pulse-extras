name: Zig regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    name: Detect change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      level: ${{ steps.scope.outputs.level }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test change classifier
        run: python3 -m unittest discover -s scripts -p 'test_ci_scope.py'
      - name: Determine CI scope
        id: scope
        run: python3 scripts/ci_scope.py

  checks:
    needs: scope
    if: needs.scope.outputs.level != 'docs'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check Python scripts compile
        run: python -m compileall -q scripts tests/companion
      - name: Test CI helper scripts
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Restore Zig archive cache
        id: zig-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/pulse-zig-archives
          key: zig-archive-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.zig-version', 'scripts/zig-downloads.json') }}
      - name: Install and verify pinned Zig
        run: python scripts/install_zig.py
      - name: Save verified Zig archive immediately
        if: steps.zig-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/pulse-zig-archives
          key: ${{ steps.zig-cache.outputs.cache-primary-key }}
      - run: zig version
      - name: Check Zig formatting (show exact correction on failure)
        shell: bash
        run: |
          if ! zig fmt --check build.zig shared extensions; then
            zig fmt build.zig shared extensions || exit 1
            git --no-pager diff -- build.zig shared extensions
            echo "::error::Zig formatting differs; apply zig fmt locally before committing."
            exit 1
          fi
      - name: Fast ZIP admission and extraction regression
        if: needs.scope.outputs.level != 'vcs'
        timeout-minutes: 4
        run: zig test shared/companion/pet_zip.zig
      - name: Isolated Windows Job Object tests (phase diagnostics)
        if: runner.os == 'Windows'
        timeout-minutes: 4
        shell: pwsh
        run: |
          foreach ($filter in @('Windows job ABI', 'Windows job captures', 'Windows job times out', 'Windows job rejects')) {
            Write-Host "::group::$filter"
            zig test shared/process/windows_tree.zig --test-filter "$filter"
            $status = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($status -ne 0) { exit $status }
          }
      - name: Install pinned Jujutsu CLI
        if: needs.scope.outputs.level != 'companion'
        run: python scripts/ci_vcs.py jj
      - name: Check Git and JJ tools
        if: needs.scope.outputs.level != 'companion'
        run: |
          git --version
          jj --version
      - name: Install Subversion and prepare local fixture
        if: runner.os == 'Linux' && needs.scope.outputs.level != 'companion'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends subversion
          svn --version --quiet
          python scripts/ci_vcs.py svn-fixture
      - name: Unit and real repository integration tests
        timeout-minutes: 15
        shell: bash
        run: |
          case "$CI_LEVEL" in
            companion) zig build test-companion --summary all ;;
            vcs) zig build test-vcs --summary all ;;
            full) zig build test --summary all ;;
            *) exit 1 ;;
          esac
        env:
          CI_LEVEL: ${{ needs.scope.outputs.level }}
          PULSE_REQUIRE_GIT: '1'
          PULSE_REQUIRE_JJ: '1'
      - name: Build production extensions
        if: needs.scope.outputs.level != 'companion'
        run: zig build -Dtarget=x86_64-windows-msvc -Doptimize=ReleaseSafe --summary all
      - name: Fetch pinned native SDK headers
        if: runner.os == 'Windows' && needs.scope.outputs.level == 'full'
        run: python scripts/fetch_sdk.py
      - name: Verify generated bindings match the pinned SDK
        if: runner.os == 'Windows' && needs.scope.outputs.level == 'full'
        run: python scripts/generate_bindings.py --check
      - name: Verify actual DLL against C ABI
        if: runner.os == 'Windows' && needs.scope.outputs.level == 'full'
        shell: pwsh
        run: |
          zig cc -std=c11 -target x86_64-windows-gnu -I.sdk-cache/include tests/abi/loader.c -o zig-out/abi-loader.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dll = @(Get-ChildItem zig-out -Recurse -Filter pulse_abi_probe.dll)
          if ($dll.Count -ne 1) { throw "Expected one ABI probe DLL" }
          & ./zig-out/abi-loader.exe $dll[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise actual Companion DLL settings lifecycle against pinned C ABI
        if: runner.os == 'Windows' && needs.scope.outputs.level == 'full'
        shell: pwsh
        run: |
          zig cc -std=c11 -Wall -Wextra -Werror -target x86_64-windows-gnu -I.sdk-cache/include tests/abi/companion_loader.c -o zig-out/companion-loader.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dll = @(Get-ChildItem zig-out -Recurse -Filter pulse_companion.dll)
          if ($dll.Count -ne 1) { throw "Expected one Companion DLL" }
          & ./zig-out/companion-loader.exe $dll[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  companion_native:
    name: Windows companion (${{ matrix.lane }})
    needs: scope
    if: needs.scope.outputs.level == 'companion' || needs.scope.outputs.level == 'full'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [ipc, desktop]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore Zig archive cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/pulse-zig-archives
          key: zig-archive-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.zig-version', 'scripts/zig-downloads.json') }}
      - name: Install and verify pinned Zig
        run: python scripts/install_zig.py
      - run: zig version
      - name: Prepare companion native test output
        if: matrix.lane == 'ipc'
        shell: pwsh
        run: New-Item -ItemType Directory -Force zig-out | Out-Null
      - name: Compile and exercise experimental Windows named pipe
        if: matrix.lane == 'ipc'
        shell: pwsh
        run: |
          zig cc -std=c11 -Wall -Wextra -Werror -target x86_64-windows-gnu shared/companion/openpets_pipe_win32.c tests/companion/openpets_pipe_win32_test.c -o zig-out/openpets-pipe-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./zig-out/openpets-pipe-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile and exercise experimental Windows discovery trust
        if: matrix.lane == 'ipc'
        shell: pwsh
        run: |
          zig cc -std=c11 -Wall -Wextra -Werror -target x86_64-windows-gnu shared/companion/openpets_trust_win32.c tests/companion/openpets_trust_win32_test.c -ladvapi32 -o zig-out/openpets-trust-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./zig-out/openpets-trust-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise Zig to Win32 OpenPets probe end to end
        if: matrix.lane == 'ipc'
        shell: pwsh
        run: |
          zig test shared/companion/openpets_windows.zig shared/companion/openpets_bridge_win32.c shared/companion/openpets_trust_win32.c shared/companion/openpets_pipe_win32.c tests/companion/openpets_bridge_fixture.c -target x86_64-windows-gnu -lc -ladvapi32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise native layered pet surface with synthetic pixels
        if: matrix.lane == 'ipc'
        shell: pwsh
        run: |
          zig cc -std=c11 -Wall -Wextra -Werror -target x86_64-windows-gnu shared/companion/pet_surface_win32.c tests/companion/pet_surface_win32_test.c -luser32 -lgdi32 -o zig-out/pet-surface-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./zig-out/pet-surface-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test isolated companion configuration record
        if: matrix.lane == 'ipc'
        shell: pwsh
        run: |
          zig cc -std=c11 -Wall -Wextra -Werror -target x86_64-windows-gnu shared/companion/pet_config_win32.c tests/companion/pet_config_win32_test.c -ladvapi32 -o zig-out/pet-config-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./zig-out/pet-config-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare companion native test output
        if: matrix.lane == 'desktop'
        shell: pwsh
        run: New-Item -ItemType Directory -Force zig-out | Out-Null
      - name: Build and smoke test standalone desktop companion
        if: matrix.lane == 'desktop'
        shell: pwsh
        run: |
          zig build pet-demo -Doptimize=ReleaseSafe --summary all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./zig-out/bin/pulse-pet-demo.exe --smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./zig-out/bin/pulse-pet-demo.exe --smoke --scale 150
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/companion/pet_stop_smoke.py zig-out/bin/pulse-pet-demo.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/companion/pet_package_smoke.py zig-out/bin/pulse-pet-demo.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test contained companion process supervision
        if: matrix.lane == 'desktop'
        shell: pwsh
        run: |
          zig cc -std=c11 -Wall -Wextra -Werror -target x86_64-windows-gnu shared/companion/pet_supervisor_win32.c tests/companion/pet_supervisor_win32_test.c -lshell32 -lpsapi -o zig-out/pet-supervisor-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $demo = (Resolve-Path ./zig-out/bin/pulse-pet-demo.exe).Path
          & ./zig-out/pet-supervisor-test.exe $demo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise approved Zig companion host with actual child
        if: matrix.lane == 'desktop'
        shell: pwsh
        timeout-minutes: 4
        run: |
          zig test shared/companion_host.zig shared/companion/pet_supervisor_win32.c tests/companion/pet_host_fixture.c -target x86_64-windows-gnu -lc -lpsapi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise multi-instance Zig companion manager
        if: matrix.lane == 'desktop'
        shell: pwsh
        timeout-minutes: 4
        run: |
          zig test shared/companion/pet_supervisor_win32.c tests/companion/pet_host_fixture.c -target x86_64-windows-gnu -lc -lpsapi --dep runtime_budget '-Mroot=shared/companion_group_test.zig' '-Mruntime_budget=shared/runtime/budget.zig'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build pinned WebP helper for real managed-pet regression
        if: matrix.lane == 'desktop'
        shell: pwsh
        timeout-minutes: 6
        run: |
          python scripts/install_pet_webp.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig build pet-demo -Doptimize=ReleaseSafe -Dpet-libwebp=true --summary all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise GNU runtime bridge from an MSVC Zig executable
        if: matrix.lane == 'desktop'
        shell: pwsh
        timeout-minutes: 4
        run: |
          zig build companion-runtime-bridge -Doptimize=ReleaseSafe --summary all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig build companion-bridge-probe -Dtarget=x86_64-windows-msvc -Doptimize=ReleaseSafe --summary all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PULSE_BRIDGE_FIXTURE_SHA256 = (Get-FileHash -Algorithm SHA256 ./zig-out/bin/pulse_companion_runtime.dll).Hash
          $leaseFixture = Join-Path (Resolve-Path zig-out).Path ("bridge-lease-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $leaseFixture -ErrorAction Stop | Out-Null
          $env:PULSE_BRIDGE_FIXTURE_PRIVATE_PARENT = $leaseFixture
          try {
            & ./zig-out/bin/companion-bridge-probe.exe
            if ($LASTEXITCODE -ne 0) { throw "Companion bridge probe failed: $LASTEXITCODE" }
            python tests/companion/pet_managed_bridge_fixture.py $leaseFixture zig-out/bin/pulse-pet-demo.exe
            if ($LASTEXITCODE -ne 0) { throw "Managed fixture generation failed: $LASTEXITCODE" }
            $env:PULSE_BRIDGE_FIXTURE_HELPER_SHA256 = (Get-FileHash -Algorithm SHA256 ./zig-out/bin/pulse-pet-demo.exe).Hash
            $env:PULSE_BRIDGE_FIXTURE_MANAGED = "1"
            & ./zig-out/bin/companion-bridge-probe.exe
            if ($LASTEXITCODE -ne 0) { throw "Managed bridge probe failed: $LASTEXITCODE" }
          } finally {
            Remove-Item -LiteralPath $leaseFixture -Recurse -Force -ErrorAction Stop
            Remove-Item Env:PULSE_BRIDGE_FIXTURE_PRIVATE_PARENT
            Remove-Item Env:PULSE_BRIDGE_FIXTURE_MANAGED, Env:PULSE_BRIDGE_FIXTURE_HELPER_SHA256 -ErrorAction SilentlyContinue
          }
      - name: Exercise bundled Companion DLL with actual pet lifecycle
        if: matrix.lane == 'desktop'
        shell: pwsh
        timeout-minutes: 5
        run: |
          python scripts/fetch_sdk.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runtime = (Get-FileHash -Algorithm SHA256 zig-out/bin/pulse_companion_runtime.dll).Hash.ToLowerInvariant()
          $helper = (Get-FileHash -Algorithm SHA256 zig-out/bin/pulse-pet-demo.exe).Hash.ToLowerInvariant()
          zig build -Dtarget=x86_64-windows-msvc -Doptimize=ReleaseSafe "-Dcompanion-runtime-sha256=$runtime" "-Dcompanion-helper-sha256=$helper" --prefix zig-out/bundled --summary all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dll = @(Get-ChildItem zig-out/bundled -Recurse -Filter pulse_companion.dll)
          if ($dll.Count -ne 1) { throw "Expected one bundled Companion DLL" }
          Copy-Item zig-out/bin/pulse_companion_runtime.dll $dll[0].DirectoryName
          Copy-Item zig-out/bin/pulse-pet-demo.exe $dll[0].DirectoryName
          zig cc -std=c11 -Wall -Wextra -Werror -target x86_64-windows-gnu -I.sdk-cache/include tests/abi/companion_loader.c -o zig-out/companion-bundled-loader.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./zig-out/companion-bundled-loader.exe $dll[0].FullName --bundled
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise private companion root ACL and exclusive owner lease
        if: matrix.lane == 'desktop'
        shell: pwsh
        timeout-minutes: 3
        run: |
          zig cc -std=c11 -Wall -Wextra -Werror -target x86_64-windows-gnu shared/companion/pet_private_root_win32.c tests/companion/pet_private_root_win32_test.c -ladvapi32 -o zig-out/pet-private-root-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./zig-out/pet-private-root-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test durable companion catalog preferences
        if: matrix.lane == 'desktop'
        shell: pwsh
        timeout-minutes: 4
        run: |
          zig test shared/companion/pet_catalog_store_win32.c tests/companion/pet_catalog_store_fixture.c -target x86_64-windows-gnu -lc --dep runtime_budget '-Mroot=shared/companion_catalog_store.zig' '-Mruntime_budget=shared/runtime/budget.zig'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test actual companion helper import and durable reload
        if: matrix.lane == 'desktop'
        shell: pwsh
        timeout-minutes: 5
        run: |
          python tests/companion/pet_stress_fixtures.py zig-out/import-fixtures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig build test-companion-import --summary all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./zig-out/bin/pulse-pet-demo.exe --check-package "$PWD/zig-out/import-fixtures/hoodie-cat" hoodie-cat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  gate:
    name: Regression gate
    if: always()
    needs: [scope, checks, companion_native]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm required checks completed
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          LEVEL: ${{ needs.scope.outputs.level }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          NATIVE_RESULT: ${{ needs.companion_native.result }}
        shell: bash
        run: |
          if [[ "$SCOPE_RESULT" != success ]]; then
            echo "::error::Change classification did not succeed"
            exit 1
          fi
          case "$LEVEL:$CHECKS_RESULT:$NATIVE_RESULT" in
            docs:skipped:skipped)
              echo "Documentation-only change; code checks not run."
              ;;
            vcs:success:skipped|companion:success:success|full:success:success)
              echo "Required $LEVEL regression checks passed."
              ;;
            *)
              echo "::error::Unexpected scope/check status: $LEVEL:$CHECKS_RESULT:$NATIVE_RESULT"
              exit 1
              ;;
          esac
